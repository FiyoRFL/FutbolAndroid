name: Build Fútbol APK

on:
  push:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on:
  push:
    branches: [ main ] ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution:
  push:
    branches: [ main ] 'temurin'
          java-version:
  push:
    branches: [ main ] '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version:
  push:
    branches: [ main ] '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-FIYO-RFL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
