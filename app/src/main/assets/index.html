<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>IPTV Proyector</title>
<style>
:root{
  --noche:#0B132B; --franja:#1C2541; --celeste:#5BC0BE; --blanco:#FFFFFF; --sol:#FFD166; --gris:#8D99AE; --seleccion:#3A506B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--noche);color:var(--blanco);font-family:sans-serif;}
#app{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;background:var(--franja);border-bottom:4px solid var(--celeste)}
header h1{font-size:36px;font-weight:bold;color:var(--sol)}
#migas{font-size:22px;color:var(--gris)}
#contenido{flex:1;overflow:auto;padding:30px 40px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--franja);border-radius:14px;padding:20px;display:flex;align-items:center;gap:15px;cursor:pointer;border:4px solid transparent;min-height:90px;transition:transform 0.1s}
.card.foco{background:var(--seleccion);border-color:var(--sol);transform:scale(1.03)}
.card img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
.card span{font-size:24px;font-weight:bold;line-height:1.1;word-break:break-word}
.pie{padding:15px 40px;background:var(--franja);border-top:2px solid var(--noche);font-size:18px;color:var(--gris);display:flex;justify-content:space-between}

#tele{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:99}
#tele.on{display:flex}
video{width:100%;height:100%;background:#000}
.centro{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;text-align:center;z-index:100}
.centro.on{display:flex}
.centro div{background:rgba(11,19,43,0.95);border-radius:20px;padding:40px;font-size:32px;font-weight:bold;border:4px solid var(--celeste)}
.pelota{width:70px;height:70px;border-radius:50%;border:8px solid var(--gris);border-top-color:var(--sol);margin:0 auto 20px;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="titulo-app">IPTV Total</h1>
    <div id="migas">Cargando categorías...</div>
  </header>
  <div id="contenido">
    <div id="grid-categorias" class="grid"></div>
    <div id="grid-canales" class="grid" style="display:none"></div>
  </div>
  <div class="pie">
    <span>Usa las flechas del control y <b>OK</b> para entrar</span>
    <span id="estado-red">Conectando al servidor...</span>
  </div>
</div>

<div id="tele">
  <video id="video" autoplay></video>
  <div class="centro" id="cargando"><div><div class="pelota"></div>Cargando canal...</div></div>
  <div class="centro" id="error"><div>No se pudo reproducir el canal.<small style="display:block;color:var(--gris);margin-top:10px">Presiona ATRÁS para volver</small></div></div>
</div>

<script>
var HOST = 'http://flixtv.lat:8080', U = 'Castellanos99', P = 'Castellanos99';
var categorias = [], canalesActuales = [], vistaActual = 'cats'; // 'cats' o 'ans'
var foco = 0, enTele = false, catSeleccionada = null;\nvar categoriaActualIndex = 0, solicitudCanales = 0, zappingOcupado = false;
var $ = function(id){ return document.getElementById(id); };

function api(params) {
  return fetch(HOST + '/player_api.php?username=' + U + '&password=' + P + params)
    .then(function(r){ return r.json(); }).catch(function(){ return []; });
}

function cargarCategorias() {
  $('migas').textContent = 'Categorías';
  $('estado-red').textContent = 'Conectando al servidor...';
  api('&action=get_live_categories').then(function(res){
    categorias = Array.isArray(res) ? res : [];
    if (!categorias.length) {
      $('migas').textContent = 'No se pudieron cargar las categorías';
      $('estado-red').textContent = 'Revisá la conexión con el servidor';
      return;
    }
    var h = '';
    categorias.forEach(function(c, i){
      h += '<div class="card tile" data-i="'+i+'" onclick="abrirCatPorIndice('+i+')"><span></span></div>';
    });
    $('grid-categorias').innerHTML = h;
    var cards = $('grid-categorias').querySelectorAll('.tile');
    cards.forEach(function(card, i) {
      card.querySelector('span').textContent = categorias[i].category_name || 'Categoría';
    });
    $('estado-red').textContent = categorias.length + ' categorías disponibles';
    vistaActual = 'cats';
    foco = 0;
    actualizarFoco();
  }).catch(function(){
    $('migas').textContent = 'Error al conectar';
    $('estado-red').textContent = 'No se pudo obtener la lista de categorías';
  });
}

function abrirCatPorIndice(indice) {
  if (!categorias[indice]) return;
  categoriaActualIndex = indice;
  abrirCat(categorias[indice].category_id, categorias[indice].category_name, false);
}

function abrirCat(id, nombre, autoPlay) {
  var indice = categorias.findIndex(function(c){ return String(c.category_id) === String(id); });
  if (indice >= 0) categoriaActualIndex = indice;
  catSeleccionada = nombre;
  $('migas').textContent = 'Categoría: ' + nombre;
  $('grid-categorias').style.display = 'none';
  $('grid-canales').style.display = 'grid';
  $('grid-canales').innerHTML = '<div style="font-size:24px;color:var(--sol)">Cargando canales de ' + nombre + '...</div>';
  vistaActual = 'cans';
  foco = 0;

  var solicitud = ++solicitudCanales;
  api('&action=get_live_streams&category_id=' + encodeURIComponent(id)).then(function(res){
    if (solicitud !== solicitudCanales) return;
    canalesActuales = Array.isArray(res) ? res : [];
    renderCanales();
    $('estado-red').textContent = canalesActuales.length + ' canales en ' + nombre;
    if (autoPlay && canalesActuales.length) {
      var indiceCanal = autoPlay > 0 ? 0 : canalesActuales.length - 1;
      reproducir(indiceCanal);
    } else {
      actualizarFoco();
    }
  }).catch(function(){
    if (solicitud !== solicitudCanales) return;
    canalesActuales = [];
    $('grid-canales').innerHTML = '<div style="font-size:24px;color:var(--sol)">No se pudieron cargar los canales</div>';
    $('estado-red').textContent = 'Error cargando ' + nombre;
  });
}

function renderCanales() {
  var h = '';
  canalesActuales.forEach(function(c, i){
    h += '<div class="card tile" data-i="'+i+'" onclick="reproducir('+i+')"></div>';
  });
  $('grid-canales').innerHTML = h;
  var cards = $('grid-canales').querySelectorAll('.tile');
  cards.forEach(function(card, i) {
    var canal = canalesActuales[i];
    if (canal.stream_icon) {
      var img = document.createElement('img');
      img.src = canal.stream_icon;
      img.onerror = function(){ this.style.display = 'none'; };
      card.appendChild(img);
    }
    var span = document.createElement('span');
    span.textContent = canal.name || 'Canal';
    card.appendChild(span);
  });
}

function tiles() {
  var selector = vistaActual === 'cans' ? '#grid-canales .tile' : '#grid-categorias .tile';
  return document.querySelectorAll(selector);
}

function actualizarFoco() {
  var t = tiles();
  if(!t.length) return;
  if(foco >= t.length) foco = t.length - 1;
  if(foco < 0) foco = 0;
  t.forEach(function(el, idx){
    if(idx === foco) {
      el.classList.add('foco');
      el.scrollIntoView({behavior: 'auto', block: 'nearest'});
    } else {
      el.classList.remove('foco');
    }
  });
}

function moverGrid(dir) {
  var t = tiles();
  if(!t.length) return;
  var ancho = $('contenido').clientWidth;
  var tarjeta = t[0].getBoundingClientRect();
  var cols = Math.max(1, Math.floor((ancho + 20) / (tarjeta.width + 20)));
  if(dir === 'arriba') foco -= cols;
  if(dir === 'abajo') foco += cols;
  if(dir === 'izq') foco -= 1;
  if(dir === 'der') foco += 1;
  if(foco < 0) foco = 0;
  if(foco >= t.length) foco = t.length - 1;
  actualizarFoco();
}

function reproducir(i) {
  window.canalActualIndex = i;
  var s = canalesActuales[i];
  if(!s) return;
  enTele = true;
  $('tele').classList.add('on');
  $('cargando').classList.add('on');
  $('error').classList.remove('on');

  var streamUrl = HOST + '/live/' + U + '/' + P + '/' + s.stream_id + '.ts';
  if(window.AndroidPlayer && AndroidPlayer.play) {
    AndroidPlayer.play(streamUrl, s.name);
    return;
  }
  var v = $('video');
  v.src = streamUrl;
  v.load();
  v.play().catch(function(){});
}

$('video').addEventListener('playing', function(){ $('cargando').classList.remove('on'); });
$('video').addEventListener('error', function(){ $('cargando').classList.remove('on'); $('error').classList.add('on'); });


function volverAtras() {
  if (enTele) {
    enTele = false;

    $('tele').classList.remove('on');
    $('cargando').classList.remove('on');
    $('error').classList.remove('on');

    var v = $('video');
    v.pause();
    v.removeAttribute('src');
    v.load();

    if (window.AndroidPlayer && AndroidPlayer.stop) {
      try { AndroidPlayer.stop(); } catch(err) {}
    }

    return true;
  }

  if (vistaActual === 'cans') {
    $('grid-canales').style.display = 'none';
    $('grid-categorias').style.display = 'grid';

    vistaActual = 'cats';
    $('migas').textContent = 'Categorías';

    foco = 0;
    actualizarFoco();
    return true;
  }

  return false;
}


// Puente de salida solicitado por MainActivity.java
function salir() {
    if (enTele) {
        volverAtras();
    }
}

// Zapping continuo: al terminar una categoría pasa a la siguiente/anterior.
function zapping(dir) {
  if (!enTele || zappingOcupado || !canalesActuales.length) return;
  var siguiente = (window.canalActualIndex || 0) + dir;

  if (siguiente >= 0 && siguiente < canalesActuales.length) {
    reproducir(siguiente);
    return;
  }

  if (!categorias.length) return;
  zappingOcupado = true;
  var total = categorias.length;
  var paso = dir > 0 ? 1 : -1;

  function probarCategoria(intentos) {
    if (intentos >= total) {
      zappingOcupado = false;
      $('estado-red').textContent = 'No hay más canales disponibles';
      return;
    }
    categoriaActualIndex = (categoriaActualIndex + paso + total) % total;
    var cat = categorias[categoriaActualIndex];
    catSeleccionada = cat.category_name;
    $('migas').textContent = 'Categoría: ' + catSeleccionada;
    var solicitud = ++solicitudCanales;

    api('&action=get_live_streams&category_id=' + encodeURIComponent(cat.category_id)).then(function(res){
      if (solicitud !== solicitudCanales) {
        zappingOcupado = false;
        return;
      }
      var lista = Array.isArray(res) ? res : [];
      if (!lista.length) {
        probarCategoria(intentos + 1);
        return;
      }
      canalesActuales = lista;
      renderCanales();
      $('estado-red').textContent = canalesActuales.length + ' canales en ' + catSeleccionada;
      zappingOcupado = false;
      reproducir(dir > 0 ? 0 : canalesActuales.length - 1);
    }).catch(function(){
      probarCategoria(intentos + 1);
    });
  }

  probarCategoria(0);
}

function codigoTecla(e) {
  return e.keyCode || e.which || 0;
}

document.addEventListener('keydown', function(e) {
  var k = codigoTecla(e);
  var key = (e.key || '').toLowerCase();

  var esAtras =
    k === 461 || k === 8 || k === 27 || k === 4 ||
    key === 'escape' || key === 'back' || key === 'browserback';

  if (esAtras) {
    e.preventDefault();
    e.stopPropagation();
    volverAtras();
    return;
  }

  if (enTele) {
    // Permitir que el reproductor gestione sus propios controles.
    return;
  }

  if (k === 38 || key === 'arrowup') {
    moverGrid('arriba');
    e.preventDefault();
  }
  else if (k === 40 || key === 'arrowdown') {
    moverGrid('abajo');
    e.preventDefault();
  }
  else if (k === 37 || key === 'arrowleft') {
    moverGrid('izq');
    e.preventDefault();
  }
  else if (k === 39 || key === 'arrowright') {
    moverGrid('der');
    e.preventDefault();
  }
  else if (k === 13 || k === 23 || k === 66 ||
           key === 'enter' || key === ' ') {
    var t = tiles();
    if (t[foco]) t[foco].click();
    e.preventDefault();
  }
}, true);

// Compatibilidad con eventos de navegación Android.
document.addEventListener('backbutton', function(e) {
  if (e) e.preventDefault();
  volverAtras();
}, true);


cargarCategorias();
</script>
</body>
</html>
